[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markdownurl"
version = "1.0.2"
description = "Extract web articles to Obsidian-flavored Markdown"
readme = "README.md"
license = "GPL-3.0"
requires-python = ">=3.10"
authors = [
    { name = "sema1011", email = "sema19689@gmail.com" },
]
keywords = ["markdown", "obsidian", "web-scraping", "article-extraction", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.8",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "click>=8.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[project.scripts]
markdownurl = "markdownurl.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["markdownurl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=markdownurl --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]
